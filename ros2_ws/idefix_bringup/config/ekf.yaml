# ekf.yaml
# robot_localization EKF fusing wheel odometry and IMU angular rate into a
# single odom -> base_footprint estimate. Becomes the sole publisher of that
# TF edge; odom_tf_broadcaster must NOT be run at the same time (slam_mapping
# / slam_nav do the swap via use_ekf:=true).
#
# Sensor weighting comes from the message covariances set in firmware:
# /odom twist vyaw variance 0.01 vs /imu/data_raw angular_velocity 0.0001,
# so yaw rate follows the gyro (immune to wheel slip) and vx comes from the
# wheels. Replay of ~/bags/wheelbase_200513 (one goal with wheel slip:
# odom +122.1 deg, gyro +53.5 deg) gave EKF +53.9 deg.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0            # = /odom rate. At 50 Hz the filter missed its deadline in bursts
                               # whenever other ros2 processes loaded the Pi (load avg ~2.9)
    two_d_mode: true           # planar differential drive; keeps z/roll/pitch locked to zero rather
                                # than letting the filter wander in unobservable dimensions
    sensor_timeout: 0.2
    use_sim_time: false

    publish_tf: true
    world_frame: odom
    odom_frame: odom
    base_link_frame: base_footprint   # not base_link: robot_state_publisher already owns
                                      # base_footprint -> base_link (URDF), and slam_toolbox
                                      # uses base_footprint as its base frame
    map_frame: map

    # /odom: fuse body-frame velocities only (vx, vyaw), not pose. The wheel
    # odometry's own integrated x/y/yaw already comes from these same
    # velocities, so fusing both would double-count the same information.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # /imu/data_raw: fuse angular velocity (vyaw) only. Do not fuse linear
    # acceleration from the MPU6500 clone at this stage, it is noisy and
    # uncalibrated (no per-axis scale/bias calibration performed yet), and
    # integrating it would hurt more than help. No orientation estimate
    # exists either (orientation_covariance[0] = -1 on the message), so
    # orientation fields are correctly left unfused.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true   # safe default even though accel isn't fused,
                                                    # in case that changes later

    use_control: false

    # process_noise_covariance and initial_estimate_covariance intentionally
    # left at robot_localization's defaults. Get the fused estimate stable
    # first, tune later against measured teleop runs.

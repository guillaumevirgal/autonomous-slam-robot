slam_toolbox:
  ros__parameters:
    use_lifecycle_manager: false

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames must match the TF tree
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    mode: mapping

    use_sim_time: false   # real hardware; sim uses idefix_simulation/config/slam_toolbox.yaml instead

    # Process a new scan once the robot moved 0.2 m OR turned 0.2 rad (~11 deg).
    # By default slam_toolbox's shouldProcessScan() only checks distance
    # (heading is ignored), so in-place turns never trigger a scan match and
    # heading drifts on odometry alone until 0.5 m of travel; one 2026-09-28 run
    # got 2 updates in 3 min of Nav2 driving. check_min_dist_and_heading_precisely
    # (slam_toolbox >= 2.8.5 on Jazzy) makes it honour minimum_travel_heading.
    # Smaller steps also keep each correction well inside the matcher's ~20 deg
    # angular search window.
    check_min_dist_and_heading_precisely: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    # Avoid processing scans faster than every this-many seconds, protects against a fast scanner flooding the matcher.
    minimum_time_interval: 0.5

    # How far back in the buffer to look for scan-matching candidates. 10 m covers
    # your whole room several times over. No need to change for this world.
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Loop closure is what corrects accumulated drift when the robot revisits a place.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0    # only attempt closures within 3 m of current pose
    loop_match_minimum_chain_size: 5     # need at least 5 linked scans to attempt a closure
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # How far the matcher searches in x/y/theta to align a new scan to the map. Wider search = more robust to odometry error but slower.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # grid cell size in metres. 0.05 (5 cm)
    resolution: 0.05

    # How often (seconds) to publish the map and the map->odom transform
    map_update_interval: 0.5
    transform_publish_period: 0.02       # 50 Hz map->odom TF

    max_laser_range: 12.0   # C1 max range is 16.0m; capped conservatively, matches sim config and nav2_params.yaml's obstacle_max_range convention
    min_laser_range: 0.05

    throttle_scans: 1

    enable_interactive_mode: true

    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

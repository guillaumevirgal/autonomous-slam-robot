# Nav2 configuration for Idefix Shared between sim (WSL2 Gazebo) and real (Pi 5 + RPLiDAR C1).

bt_navigator:
  ros__parameters:
    use_sim_time: True #Change to false on the real Pi
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20


controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0            
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5         # unused (diff-drive) but must be set
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Robot must travel this much within movement_time_allowance,otherwise the recovery BT kicks in (spin, then wait).
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Positional tolerance
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25            # ~14 deg

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.20            # m/s
      lookahead_dist: 0.4                 # m; nominal carrot distance
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5                 # scales lookahead by current speed
      use_velocity_scaled_lookahead_dist: true

      
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785  # ~45 deg, RPP will rotate in place if the initial heading error > this angle.
      rotate_to_heading_angular_vel: 0.8  # rad/s
      max_angular_accel: 2.0              # rad/s^2

      # Slows near tight curves, near obstacles, and near goal.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6    # slow when path curvature < 1/0.6
      regulated_linear_scaling_min_speed: 0.05    # never regulate below this

      use_cost_regulated_linear_velocity_scaling: true

      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6         # start slowing 0.6 m from goal


      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0


      allow_reversing: false             
      transform_tolerance: 0.2

# Global costmap (planning)
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.14                  # base_radius 0.125 + 15 mm margin
      resolution: 0.05                   
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        
        
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0         # C1 usable range is ~12 m; 8 m is safe
          obstacle_min_range: 0.0
          scan_qos: "SENSOR_DATA"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40            # ~3 * robot_radius

      always_send_full_costmap: True

# Local costmap (control)
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true                # slides with the robot
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.14

      plugins: ["obstacle_layer", "inflation_layer"] # No static_layer here: local is for freshly seen obstacles only.

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          scan_qos: "SENSOR_DATA"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

      always_send_full_costmap: True

# Global planner (NavFn Dijkstra)
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5                      # goal tolerance for planner
      use_astar: false                    # Dijkstra: deterministic across runs
      allow_unknown: true

# Smoother 
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# Recovery behaviors
behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

# TODO - Waypoint follower (kept for Phase 4)
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Velocity smoother
# Filters /cmd_vel from the controller before it hits the diff-drive plugin (or micro-ROS on the real robot). 
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 1.0]         # [vx, vy, wz]; vy unused for diff-drive
    min_velocity: [-0.22, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Map server
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/guillaume/robot_ws/maps/idefix_lab.yaml"     # TODO - generalise for supplied at launch time via parameter substitution so the same yaml can point at different maps.